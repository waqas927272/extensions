<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AAH Address Browser Tests</title>
  <script src="../address-validation.js"></script>
</head>
<body>
  <main id="results">Running…</main>
  <section id="mapsFixture"></section>
  <script>
    (async () => {
      const output = document.getElementById('results');
      const fixture = document.getElementById('mapsFixture');
      const scraperSource = await fetch('../google-maps-scraper.js').then(response => response.text());
      const assertions = [];

      function assert(name, condition) {
        assertions.push({ name, passed: Boolean(condition) });
      }

      async function runMapsFixture(context, businessName, address) {
        fixture.innerHTML = `
          <h1 class="DUwDvf">${businessName}</h1>
          <button data-item-id="address" aria-label="Address: ${address}">${address}</button>
        `;
        globalThis.__AAH_ADDRESS_CONTEXT__ = { ...context, maxWaitMs: 80, pollMs: 10 };
        return await eval(scraperSource);
      }

      const affton = await runMapsFixture(
        { hospitalName: 'Prioritypet Urgent Care Of Affton', location: 'St. Louis, MO' },
        'PriorityPet Urgent Care',
        '9998 Gravois Rd, Affton, MO 63123, United States'
      );
      assert('Maps context survives a rewritten URL', affton.streetAddress === '9998 Gravois Rd');
      assert('Maps parser keeps the ZIP atomic with the street', affton.zipCode === '63123');

      const validated = AAHAddressValidation.validateGoogleResult(affton, {
        hospitalName: 'Prioritypet Urgent Care Of Affton',
        location: 'St. Louis, MO'
      });
      const job = { location: 'St. Louis, MO', city: 'Affton', state: 'Missouri' };
      AAHAddressValidation.applyAddressOutcome(job, validated);
      assert('Filtration city is preserved', job.city === 'St. Louis');
      assert('Filtration state is preserved', job.state === 'Missouri');

      const wrongBusiness = await runMapsFixture(
        { hospitalName: 'Berclair Animal Hospital', location: 'Memphis, TN' },
        'Unrelated Pet Clinic',
        '5169 Wheelis Dr, Memphis, TN 38117, United States'
      );
      assert('Wrong business is rejected', wrongBusiness.streetAddress === '');

      const failed = assertions.filter(item => !item.passed);
      output.dataset.status = failed.length ? 'FAIL' : 'PASS';
      output.textContent = failed.length
        ? `FAIL ${assertions.length - failed.length}/${assertions.length}: ${failed.map(item => item.name).join('; ')}`
        : `PASS ${assertions.length}/${assertions.length}`;
    })().catch(error => {
      const output = document.getElementById('results');
      output.dataset.status = 'ERROR';
      output.textContent = `ERROR: ${error.message}`;
    });
  </script>
</body>
</html>
